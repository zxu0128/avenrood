<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>avenrood photography</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;400&display=swap" rel="stylesheet">

  <style>
    :root { --header-h: 60px; --side-pad: 1rem; --gallery-pad: 40px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Raleway', Arial, Helvetica, sans-serif;
      font-weight: 200;
      color: #111;
      background: #f3f3f3;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--side-pad);
      background: rgba(243,243,243,0.9);
      backdrop-filter: blur(5px);
      border-bottom: 1px solid rgba(200,200,200,0.5);
      z-index: 1000;
    }

    .logo {
      font-weight: 400;
      font-size: 1.15rem;
      text-transform: lowercase;
      letter-spacing: 0;
    }
    .logo a { text-decoration: none; color: inherit; }

    /* Navigation */
    nav {
      display: flex;
      gap: 1rem;
      align-items: center;
      overflow-x: auto;
      transition: max-height 0.3s ease;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-weight: 200;
      padding: 6px 8px;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    nav a.active { opacity: 0.65; }

    /* Hamburger */
    .menu-toggle {
      display: none;
      cursor: pointer;
      flex-direction: column;
      justify-content: center;
      width: 24px;
      height: 24px;
      gap: 5px;
    }
    .menu-toggle span {
      display: block;
      height: 2px;
      width: 100%;
      background: #111;
      transition: 0.3s;
    }

    /* Gallery container */
    .gallery-container {
      position: absolute; top: var(--header-h); left: 0; right: 0; bottom: 0;
      height: calc(100vh - var(--header-h));
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: auto;
      background: #f3f3f3;
    }

    .gallery-track {
      display: inline-flex;
      height: 100%;
      align-items: center;
      padding: 0 28px;
    }
    .gallery-track::after { content: ''; flex: 0 0 28px; }

    .photo {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      margin: 0 10px;
    }
    .photo img {
      max-height: calc(100% - var(--gallery-pad)*2);
      width: auto;
      object-fit: contain;
      display: block;
    }

    p { font-size: 0.9em; }

    /* MOBILE MENU BEHAVIOR */
    @media (max-width: 800px) {
      nav {
        position: absolute;
        top: var(--header-h);
        right: 0;
        background: rgba(243,243,243,0.98);
        flex-direction: column;
        align-items: flex-end;
        width: 100%;
        padding: 0.5rem 1rem;
        gap: 0.8rem;
        max-height: 0;
        overflow: hidden;
        border-bottom: 1px solid rgba(200,200,200,0.5);
      }

      nav.open {
        max-height: 300px;
      }

      .menu-toggle {
        display: flex;
      }

      /* Hide desktop nav links when menu closed */
      @media (max-width: 800px) {
        nav a {
          width: fit-content;
        }
      }

      .menu-toggle.open span:nth-child(1) {
        transform: rotate(45deg) translateY(7px);
      }
      .menu-toggle.open span:nth-child(2) {
        opacity: 0;
      }
      .menu-toggle.open span:nth-child(3) {
        transform: rotate(-45deg) translateY(-7px);
      }
    }

    /* Mobile gallery adjustments */
    @media (max-width: 700px) {
      .photo {
        margin: 20px 8px;
        height: calc(80% - 50px);
      }
      .photo img {
        max-height: 100%;
        width: auto;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">avenrood</a></div>

    <nav id="navMenu">
      <a href="info.html">info</a>
      <a href="collections.html">collection i</a>
      <a href="collection-ii.html">collection ii</a>
      <a href="collection-iii.html">collection iii</a>
      <a href="prints.html">prints</a>
      <a href="https://instagram.com/avenrood" target="_blank" rel="noopener noreferrer">instagram</a>
    </nav>

    <!-- Hamburger button on the far right -->
    <div class="menu-toggle" id="menuToggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <div class="gallery-container" id="gallery">
    <div class="gallery-track" id="galleryTrack">
      <div class="photo"><img src="images/radiantcut.jpg" alt="radiant cut"></div>
      <div class="photo"><img src="images/blindfolded.jpg" alt="blind folded"></div>
      <div class="photo"><img src="images/ontheline.jpeg" alt="hanging on the line"></div>
      <div class="photo"><img src="images/liquidity.jpg" alt="liquidity"></div>
      <div class="photo"><img src="images/flame.jpg" alt="flame"></div>
      <div class="photo"><img src="images/mobius.jpg" alt="mobius"></div>
      <div class="photo"><img src="images/dreambus.webp" alt="bus"></div>
      <div class="photo"><img src="images/eyeonyou.png" alt="eye on you"></div>
      <div class="photo"><img src="images/company.jpg" alt="company"></div>
      <div class="photo"><img src="images/noexit.jpg" alt="no exit"></div>
      <div class="photo"><img src="images/landing.jpg" alt="landing"></div>
      <div class="photo"><img src="images/arrowoftime.jpeg" alt="arrow of time"></div>
    </div>
  </div>

  <script>
    // Horizontal scroll behavior
    (function() {
      const gallery = document.getElementById('gallery');
      let pendingDelta = 0;
      let ticking = false;

      gallery.addEventListener('wheel', function(e) {
        if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
        e.preventDefault();
        pendingDelta += e.deltaY;

        if (!ticking) {
          ticking = true;
          requestAnimationFrame(() => {
            const maxScroll = gallery.scrollWidth - gallery.clientWidth;
            let next = gallery.scrollLeft + pendingDelta;
            if (next < 0) next = 0;
            if (next > maxScroll) next = maxScroll;
            gallery.scrollLeft = next;
            pendingDelta = 0;
            ticking = false;
          });
        }
      }, { passive: false });
    })();

    // Hamburger menu toggle
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');
    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('open');
      navMenu.classList.toggle('open');
    });
  </script>
</body>
</html>
