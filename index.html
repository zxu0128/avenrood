<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>avenrood photography</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;400&display=swap" rel="stylesheet">

  <style>
    :root { --header-h: 60px; --side-pad: 0.8rem; --gallery-pad: 40px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Raleway', Arial, Helvetica, sans-serif;
      font-weight: 200;
      color: #111;
      background: #f3f3f3;
      height: 100vh;
      overflow: hidden;
    }

    /* --- HEADER --- */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: var(--header-h);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 var(--side-pad);
      background: rgba(243,243,243,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(200,200,200,0.5);
      z-index: 1000;
    }

    .logo {
      font-weight: 400; font-size: 1.15rem; text-transform: lowercase;
    }
    .logo a { text-decoration: none; color: inherit; }

    nav {
      display: flex; gap: 1rem; align-items: center;
      transition: all 0.3s ease;
    }
    nav a {
      text-decoration: none; color: #111; font-weight: 200;
      padding: 6px 8px; white-space: nowrap; transition: opacity 0.2s;
    }
    nav a.active { opacity: 0.65; }

    /* --- Hamburger --- */
    .menu-toggle {
      display: none;
      position: relative;
      width: 26px;
      height: 22px;
      cursor: pointer;
      justify-content: center;
      align-items: center;
    }

    .menu-toggle span {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #111;
      transition: all 0.4s ease;
    }

    .menu-toggle span:nth-child(1) { top: 4px; }
    .menu-toggle span:nth-child(2) { top: 10px; }
    .menu-toggle span:nth-child(3) { top: 16px; }

    .menu-toggle.open span:nth-child(1) {
      transform: rotate(45deg);
      top: 10px;
    }
    .menu-toggle.open span:nth-child(2) {
      opacity: 0;
    }
    .menu-toggle.open span:nth-child(3) {
      transform: rotate(-45deg);
      top: 10px;
    }

    @media (max-width: 800px) {
      .menu-toggle { display: flex; }

      nav {
        position: absolute;
        top: var(--header-h);
        right: 0;
        width: 100%;
        background: rgba(243,243,243,0.92);
        backdrop-filter: blur(10px);
        flex-direction: column;
        align-items: flex-end;
        gap: 0.8rem;
        padding: 0.8rem 1rem;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
        transform: translateY(-8px);
        transition: opacity 0.4s ease, transform 0.4s ease, max-height 0.4s ease;
      }

      nav.open {
        max-height: 300px;
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
    }

    /* --- Gallery --- */
    .gallery-container {
      position: absolute; top: var(--header-h); left: 0; right: 0; bottom: 0;
      height: calc(100vh - var(--header-h));
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: auto;
      background: #f3f3f3;
    }

    .gallery-track {
      display: inline-flex;
      height: 100%;
      align-items: center;
      padding: 0 20px;
    }

    .photo {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      margin: 0 8px;
    }

    .photo img {
      max-height: calc(100% - var(--gallery-pad)*2);
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* --- Mobile Adjustments --- */
    @media (max-width: 700px) {
      .gallery-track { padding: 0 10px; }
      .photo {
        margin: 30px 6px;  /* more vertical margin */
        height: calc(85% - 60px); /* slightly higher images */
      }
      .photo img { max-height: 100%; width: auto; object-fit: contain; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">avenrood</a></div>
    <div class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></div>
    <nav id="navMenu">
      <a href="info.html">info</a>
      <a href="shapesofshadows.html">shapes of shadows</a>
      <a href="whisperingscenes.html">whispers</a>
      <a href="memories.html">memories</a>
      <a href="prints.html">prints</a>
      <a href="https://instagram.com/avenrood" target="_blank" rel="noopener noreferrer">instagram</a>
    </nav>
  </header>

  <div class="gallery-container" id="gallery">
    <div class="gallery-track" id="galleryTrack">
      <div class="photo"><img src="images/radiantcut.jpg" alt="radiant cut"></div>
      <div class="photo"><img src="images/blindfolded.jpg" alt="blind folded"></div>
      <div class="photo"><img src="images/ontheline.jpeg" alt="on the line"></div>
      <div class="photo"><img src="images/liquidity.jpg" alt="liquidity"></div>
      <div class="photo"><img src="images/flame.jpg" alt="flame"></div>
      <div class="photo"><img src="images/mobius.jpg" alt="mobius"></div>
      <div class="photo"><img src="images/dreambus.webp" alt="bus"></div>
      <div class="photo"><img src="images/eyeonyou.png" alt="eye on you"></div>
      <div class="photo"><img src="images/company.jpg" alt="company"></div>
      <div class="photo"><img src="images/noexit.jpg" alt="no exit"></div>
      <div class="photo"><img src="images/landing.jpg" alt="landing"></div>
      <div class="photo"><img src="images/arrowoftime.jpeg" alt="arrow of time"></div>
    </div>
  </div>

  <script>
    // Smooth wheel scroll for horizontal gallery
    (function() {
      const gallery = document.getElementById('gallery');
      let pendingDelta = 0, ticking = false;

      gallery.addEventListener('wheel', function(e) {
        if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
        e.preventDefault();
        pendingDelta += e.deltaY;
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(() => {
            const maxScroll = gallery.scrollWidth - gallery.clientWidth;
            let next = gallery.scrollLeft + pendingDelta;
            if (next < 0) next = 0;
            if (next > maxScroll) next = maxScroll;
            gallery.scrollLeft = next;
            pendingDelta = 0; ticking = false;
          });
        }
      }, { passive: false });
    })();

    // Hamburger menu
    const toggle = document.getElementById('menuToggle');
    const nav = document.getElementById('navMenu');
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('open');
      nav.classList.toggle('open');
    });
  </script>
</body>
</html>
