<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght=200;400&display=swap" rel="stylesheet">

  <style>
    :root { --header-h: 60px; --side-pad: 1rem; --gallery-pad: 40px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Raleway', Arial, Helvetica, sans-serif;
      font-weight: 200;
      color: #111;
      background: #fafafa;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: var(--header-h);
      display: grid; grid-template-columns: auto 1fr; align-items: center;
      padding: 0 var(--side-pad);
      background: rgba(250,250,250,0.9);
      backdrop-filter: blur(5px);
      border-bottom: 1px solid rgba(200,200,200,0.4);
      z-index: 1000;
    }
    .logo { font-weight: 400; font-size: 1.15rem; text-transform: lowercase; letter-spacing: 0; z-index: 1001; }
    .logo a { text-decoration: none; color: inherit; }
    nav { justify-self: end; display: flex; gap: 1rem; align-items: center; }
    nav a { text-decoration: none; color: #111; font-weight: 200; padding: 6px 8px; white-space: nowrap; transition: opacity 0.2s; }
    nav a.active { opacity: 0.65; }

    /* Hamburger Menu Button (Desktop Hidden) */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 6px;
      justify-self: end;
      z-index: 1001;
      padding: 8px;
    }
    .menu-toggle span {
      display: block;
      width: 20px;
      height: 1px;
      background-color: #111;
      transition: transform 0.3s, opacity 0.3s;
    }

    /* Gallery container */
    .gallery-container {
      position: absolute; top: var(--header-h); left: 0; right: 0; bottom: 0;
      height: calc(100vh - var(--header-h));
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: auto;
      background: #fafafa;
    }

    /* inner track (inline-flex) — Safari-friendly width calculation */
    .gallery-track {
      display: inline-flex;
      height: 100%;
      align-items: center;
      padding: 0 28px;
      gap: 20px;
    }
    .gallery-track::after { content: ''; flex: 0 0 28px; }

    .photo {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: -webkit-max-content;
      width: max-content;
    }
    .photo img {
      max-height: calc(100% - var(--gallery-pad)*2);
      width: auto;
      object-fit: contain;
      border-radius: 0;
      display: block;
    }

    p { font-size: 0.9em; }

    /* Mobile adjustments */
    @media (max-width: 700px) {
      header { padding: 0 1rem; }
      .logo { font-size: 1rem; }
      
      .menu-toggle { display: flex; }

      /* Left-aligned, tight overlay mobile layout */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #fafafa;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-left: 3rem;
        gap: 1.1rem;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s, visibility 0.25s;
        z-index: 1000;
      }

      nav.open {
        opacity: 1;
        visibility: visible;
      }

      nav a {
        font-size: 1.05rem;
        padding: 4px 0;
      }

      /* CSS Transforms for Toggle Cross Action */
      .menu-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .menu-toggle.open span:nth-child(2) { opacity: 0; }
      .menu-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

      /* Visual centering: shifts track higher to sit perfectly centered in the viewport */
      .gallery-track { 
        padding: 0 16px; 
        gap: 16px;
        transform: translateY(-8vh); 
      }
      .gallery-track::after { flex: 0 0 16px; }

      .photo {
        height: 100%;
        width: -webkit-max-content;
        width: max-content;
      }

      .photo img {
        height: 55vh; 
        max-height: 55vh;
        width: auto; 
        object-fit: contain;
      }
    }
  </style>
</head>
<body>

  <script>
    (function() {
      const gallery = document.getElementById('gallery');
      let pendingDelta = 0;
      let ticking = false;

      gallery.addEventListener('wheel', function(e) {
        if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
        e.preventDefault();
        pendingDelta += e.deltaY;

        if (!ticking) {
          ticking = true;
          requestAnimationFrame(() => {
            const maxScroll = gallery.scrollWidth - gallery.clientWidth;
            let next = gallery.scrollLeft + pendingDelta;
            if (next < 0) next = 0;
            if (next > maxScroll) next = maxScroll;
            gallery.scrollLeft = next;
            pendingDelta = 0;
            ticking = false;
          });
        }
      }, { passive: false });

      const menuToggle = document.getElementById('menuToggle');
      const navMenu = document.getElementById('navMenu');

      menuToggle.addEventListener('click', function() {
        this.classList.toggle('open');
        navMenu.classList.toggle('open');
      });
    })();
  </script>
