<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>travel | avenrood</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght=200;400&display=swap" rel="stylesheet">
  <style>
    :root { --header-h: 60px; --side-pad: 1rem; --gallery-pad: 40px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Raleway', Arial, Helvetica, sans-serif; font-weight: 200; 
      color: #111; background: #fafafa; height: 100vh; overflow: hidden; 
    }
    p { font-size: 0.9em; }
    
    /* Header (Matches Index) */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: var(--header-h);
      display: grid; grid-template-columns: auto 1fr; align-items: center;
      padding: 0 var(--side-pad); background: rgba(250,250,250,0.9); 
      backdrop-filter: blur(5px); border-bottom: 1px solid rgba(200,200,200,0.4); z-index: 1000;
    }
    .logo { font-weight: 400; font-size: 1.15rem; text-transform: lowercase; letter-spacing: 0; z-index: 1001; }
    .logo a { text-decoration: none; color: inherit; }
    nav { justify-self: end; display: flex; gap: 1rem; align-items: center; }
    nav a { text-decoration: none; color: #111; font-weight: 200; padding: 6px 8px; white-space: nowrap; transition: opacity 0.2s; }
    nav a.active { opacity: 0.65; }

    .menu-toggle {
      display: none; background: none; border: none; cursor: pointer; flex-direction: column; gap: 6px; 
      justify-self: end; z-index: 1001; padding: 8px;
    }
    .menu-toggle span { display: block; width: 20px; height: 1px; background-color: #111; transition: transform 0.3s, opacity 0.3s; }

    /* Gallery (Matches Index) */
    .gallery-container {
      position: absolute; top: var(--header-h); left: 0; right: 0; bottom: 0;
      height: calc(100vh - var(--header-h)); overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch; scroll-behavior: auto; background: #fafafa;
    }
    .gallery-track { display: inline-flex; height: 100%; align-items: center; padding: 0 28px; gap: 20px; }
    .gallery-track::after { content: ''; flex: 0 0 28px; }

    .text-box { flex: 0 0 auto; max-width: 320px; align-self: flex-start; margin-top: 40px; }
    .text-box h2 { font-weight: 400; font-size: 1.15rem; margin-bottom: 1rem; }

    .photo { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; height: 100%; width: max-content; }
    .photo img { max-height: calc(100% - var(--gallery-pad)*2); width: auto; object-fit: contain; display: block; }

    /* Mobile adjustments (Matches Index) */
    @media (max-width: 700px) {
      header { padding: 0 1rem; }
      .logo { font-size: 1rem; }
      .menu-toggle { display: flex; }

      nav {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #fafafa; flex-direction: column; justify-content: center;
        align-items: flex-start; padding-left: 3rem; gap: 1.1rem;
        opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s; z-index: 1000;
      }
      nav.open { opacity: 1; visibility: visible; }
      nav a { font-size: 1.05rem; padding: 4px 0; }
      .menu-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .menu-toggle.open span:nth-child(2) { opacity: 0; }
      .menu-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

      .gallery-track { padding: 0 16px; gap: 16px; transform: translateY(-8vh); }
      .gallery-track::after { flex: 0 0 16px; }
      
      .text-box { align-self: center; margin-top: 0; }
      .photo img { height: 55vh; max-height: 55vh; width: auto; object-fit: contain; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">avenrood</a></div>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="navMenu">
      <a href="info.html">info</a>
      <a href="travel.html" class="active">travel</a>
      <a href="people.html">people</a>
      <a href="shadows.html">shadows</a>
      <a href="https://instagram.com/avenrood" target="_blank" rel="noopener noreferrer">instagram</a>
    </nav>
  </header>

  <div class="gallery-container" id="gallery">
    <div class="gallery-track" id="galleryTrack">
      <div class="text-box">
        <h2>Travel</h2>
        <p>Similar, <br> or different, <br> at the same time.</p>
      </div>
      <div class="photo"><img src="images/avenrood_001_zihan.jpeg" alt="travel"></div>
      <div class="photo"><img src="images/ontheway.jpg" alt="travel"></div>
      <div class="photo"><img src="images/aftersnow.jpg" alt="travel"></div>
      <div class="photo"><img src="images/yakintibet.jpg" alt="travel"></div>
      <div class="photo"><img src="images/flamemountains_avenrood.jpg" alt="travel"></div>
      <div class="photo"><img src="images/ontheroad.jpg" alt="travel"></div>
      <div class="photo"><img src="images/travelseries.jpg" alt="travel"></div>
      <div class="photo"><img src="images/home.jpg" alt="travel"></div>
      <div class="photo"><img src="images/llama.jpg" alt="travel"></div>
      <div class="photo"><img src="images/dune.jpg" alt="travel"></div>
      <div class="photo"><img src="images/sand.jpeg" alt="travel"></div>
      <div class="photo"><img src="images/lakeside.jpg" alt="travel"></div>  
      <div class="photo"><img src="images/palace.jpg" alt="travel"></div> 
      <div class="photo"><img src="images/highway.jpg" alt="travel"></div>    
      <div class="photo"><img src="images/danxialandscape_avenrood.jpg" alt="travel"></div>
      <div class="photo"><img src="images/sweep.jpg" alt="travel"></div>
    </div>
  </div>

  <script>
    (function() {
      const gallery = document.getElementById('gallery');
      let pendingDelta = 0, ticking = false;
      gallery.addEventListener('wheel', function(e) {
        if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
        e.preventDefault();
        pendingDelta += e.deltaY;
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(() => {
            const maxScroll = gallery.scrollWidth - gallery.clientWidth;
            let next = gallery.scrollLeft + pendingDelta;
            if (next < 0) next = 0; if (next > maxScroll) next = maxScroll;
            gallery.scrollLeft = next;
            pendingDelta = 0; ticking = false;
          });
        }
      }, { passive: false });

      const menuToggle = document.getElementById('menuToggle');
      const navMenu = document.getElementById('navMenu');
      menuToggle.addEventListener('click', function() {
        this.classList.toggle('open');
        navMenu.classList.toggle('open');
      });
    })();
  </script>
</body>
</html>
